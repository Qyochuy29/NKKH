
services:
  postgres:
    image: postgres:15-alpine
    container_name: sg-postgres
    environment:
      POSTGRES_DB: school_guardian
      POSTGRES_USER: sguser
      POSTGRES_PASSWORD: sgpassword123
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sguser -d school_guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: sg-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend-csharp
      dockerfile: Dockerfile
    container_name: sg-backend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app/frontend
      - ./tai-lieu:/app/uploads
      - dp_keys:/root/.aspnet/DataProtection-Keys
    environment:
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=school_guardian;Username=sguser;Password=sgpassword123;Port=5432"
      Redis__ConnectionString: "redis:6379"
      Jwt__Secret: "school-guardian-jwt-secret-key-2024"
      Jwt__RefreshSecret: "school-guardian-refresh-secret-key-2024"
      ASPNETCORE_ENVIRONMENT: "Production"
      ASPNETCORE_URLS: "http://+:3000"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

