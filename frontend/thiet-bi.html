<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý thiết bị — SafeVoice AI</title>
  <link rel="stylesheet" href="./giao-dien.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>
    <main class="main-content">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 style="font-size:16px;">🎙️ Danh sách thiết bị giám sát</h3>
        <button class="btn btn-primary" onclick="showAddModal()">+ Thêm thiết bị</button>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Tên</th>
                  <th>Khu vực</th>
                  <th>Tầng</th>
                  <th>Trạng thái</th>
                  <th>Pin</th>
                  <th>Cập nhật cuối</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="devices-tbody"></tbody>
            </table>
          </div>
          <div id="pagination-devices"></div>
        </div>
      </div>

      <!-- Add/Edit Modal -->
      <div class="modal-overlay" id="device-modal">
        <div class="modal">
          <div class="modal-header">
            <h3 id="modal-title">Thêm thiết bị</h3>
            <button class="modal-close" onclick="closeDeviceModal()">✕</button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="device-id">
            <div class="form-group">
              <label>Tên thiết bị</label>
              <input type="text" class="form-control" id="device-name" placeholder="VD: MIC-046">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Khu vực</label>
                <select class="form-control" id="device-area">
                  <option value="">-- Chọn khu vực --</option>
                </select>
              </div>
              <div class="form-group">
                <label>Tầng</label>
                <select class="form-control" id="device-floor">
                  <option value="1">Tầng 1</option>
                  <option value="2">Tầng 2</option>
                  <option value="3">Tầng 3</option>
                </select>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeDeviceModal()">Huỷ</button>
            <button class="btn btn-primary" onclick="saveDevice()">Lưu</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="./dung-chung.js?v=3"></script>
  <script src="./thiet-bi.js"></script>
</body>
</html>
