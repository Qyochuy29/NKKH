<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý thiết bị — SafeVoice AI</title>
  <link rel="stylesheet" href="/giao-dien.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>
    <main class="main-content">

      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">
        <h3 style="font-size:16px;">🎙️ Danh sách thiết bị giám sát</h3>
        <button class="btn btn-primary" onclick="showAddModal()">+ Thêm thiết bị</button>
      </div>

      <div class="card">
        <div class="card-body">
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Tên</th>
                  <th>Khu vực</th>
                  <th>Tầng</th>
                  <th>Trạng thái</th>
                  <th>Pin</th>
                  <th>Cập nhật cuối</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="devices-tbody"></tbody>
            </table>
          </div>
        </div>
      </div>

      <!-- Add/Edit Modal -->
      <div class="modal-overlay" id="device-modal">
        <div class="modal">
          <div class="modal-header">
            <h3 id="modal-title">Thêm thiết bị</h3>
            <button class="modal-close" onclick="closeDeviceModal()">✕</button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="device-id">
            <div class="form-group">
              <label>Tên thiết bị</label>
              <input type="text" class="form-control" id="device-name" placeholder="VD: MIC-046">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label>Khu vực</label>
                <input type="text" class="form-control" id="device-area" placeholder="VD: Hành lang T1">
              </div>
              <div class="form-group">
                <label>Tầng</label>
                <select class="form-control" id="device-floor">
                  <option value="1">Tầng 1</option>
                  <option value="2">Tầng 2</option>
                  <option value="3">Tầng 3</option>
                </select>
              </div>
            </div>
            <div class="form-group">
              <label>Vị trí trên sơ đồ (click vào bản đồ bên dưới)</label>
              <div class="school-map-container" style="cursor:crosshair;">
                <svg viewBox="0 0 400 250" id="position-svg">
                  <rect x="5" y="5" width="390" height="240" rx="4" fill="var(--bg-hover)" stroke="var(--border)"/>
                  <text x="200" y="130" text-anchor="middle" fill="var(--text-muted)" font-size="12">Click để chọn vị trí</text>
                  <circle id="position-dot" cx="0" cy="0" r="6" fill="var(--primary)" style="display:none"/>
                </svg>
              </div>
              <div class="form-row" style="margin-top:8px;">
                <div class="form-group"><label>X (%)</label><input type="number" class="form-control" id="device-x" min="0" max="100" step="0.1"></div>
                <div class="form-group"><label>Y (%)</label><input type="number" class="form-control" id="device-y" min="0" max="100" step="0.1"></div>
              </div>
            </div>
          </div>
          <div class="modal-footer">
            <button class="btn btn-outline" onclick="closeDeviceModal()">Huỷ</button>
            <button class="btn btn-primary" onclick="saveDevice()">Lưu</button>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="/dung-chung.js"></script>
  <script src="/thiet-bi.js"></script>
</body>
</html>
