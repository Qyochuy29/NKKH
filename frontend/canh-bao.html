<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cảnh báo trực tiếp — SafeVoice AI</title>
  <meta name="description" content="Theo dõi cảnh báo bạo lực học đường realtime">
  <link rel="stylesheet" href="./giao-dien.css">
</head>
<body>
  <div class="app-layout">
    <div id="app-shell"></div>
    <main class="main-content">

      <!-- Filters -->
      <div class="filters-bar">
        <select class="form-control" id="filter-type">
          <option value="">Tất cả loại</option>
          <option value="scream">🔴 La hét</option>
          <option value="help">🟠 Kêu cứu</option>
          <option value="threat">🟡 Đe dọa</option>
          <option value="argument">🟤 Cãi vã</option>
        </select>
        <select class="form-control" id="filter-status">
          <option value="" selected>Tất cả trạng thái</option>
          <option value="pending">Chờ xử lý</option>
          <option value="confirmed">Đã xác nhận</option>
          <option value="false_alarm">Báo động giả</option>
          <option value="resolved">Đã xử lý</option>
        </select>
        <select class="form-control" id="filter-area">
          <option value="">Tất cả khu vực</option>
        </select>
        <button class="btn btn-primary" onclick="loadAlerts()">🔍 Lọc</button>
        <button class="btn btn-outline" onclick="clearFilters()">Xoá lọc</button>
        <div style="flex-grow: 1;"></div>
        <button class="btn btn-danger" onclick="document.getElementById('audio-upload').click()">🎙️ Tải âm thanh lên AI</button>
        <input type="file" id="audio-upload" accept="audio/*" style="display:none" onchange="uploadAudio(event)">
      </div>

      <!-- Alert Cards -->
      <div id="alerts-list"></div>
      <div id="pagination-alerts"></div>

      <div id="alerts-empty" class="empty-state" style="display:none;">
        <div class="empty-icon">✅</div>
        <h3>Không có cảnh báo nào</h3>
        <p>Hệ thống đang hoạt động bình thường</p>
      </div>

    </main>
  </div>

  <!-- AI Loading Overlay -->
  <div id="ai-loading-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:9999; flex-direction:column; align-items:center; justify-content:center; color:white;">
    <div class="spinner" style="border: 4px solid #333; border-top: 4px solid #3498db; border-radius: 50%; width: 60px; height: 60px; animation: spin 1s linear infinite;"></div>
    <h3 style="margin-top: 24px; font-size: 1.3rem;">🤖 AI đang rà soát file âm thanh...</h3>
    <p style="color: rgba(255,255,255,0.7); margin-top: 8px;">Quá trình này có thể tốn 20-40 giây. Vui lòng đợi.</p>
    <style>@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }</style>
  </div>

  <script src="./dung-chung.js?v=7"></script>
  <script src="./canh-bao.js?v=7"></script>
</body>
</html>
